[package]
name = "voci"
version = "0.1.0"
edition = "2024"
description = "Terminal-first dictionary lookup"

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
# Persisted dictionary indexes depend on this version's Unicode case-folding data.
caseless = "=0.2.2"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures-util = "0.3"
ratatui = "0.30.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "system-proxy"] }
rusqlite = { version = "0.38", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
toml = "0.8"
unicode-segmentation = "1"
unicode-normalization = "0.1"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"
