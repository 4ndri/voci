name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Calculate release version
    runs-on: ubuntu-24.04
    outputs:
      semver: ${{ steps.gitversion.outputs.semver }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Calculate GitVersion SemVer
        id: gitversion
        shell: bash
        run: |
          version=$(mise run --quiet version)
          echo "semver=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: voci
            rustflags: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: voci
            rustflags: ''
          - os: macos-15
            target: aarch64-apple-darwin
            binary: voci
            rustflags: ''
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: voci.exe
            rustflags: '-C target-feature=+crt-static'
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.semver }}
      TARGET: ${{ matrix.target }}
      BINARY: ${{ matrix.binary }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify release version
        shell: bash
        run: test "$(mise run --quiet version)" = "$RELEASE_VERSION"
      - name: Test
        shell: bash
        run: mise run test --target "$TARGET"
      - name: Build release binary
        shell: bash
        run: mise run build --target "$TARGET"
      - name: Smoke test release binary
        shell: bash
        run: |
          test "$("target/$TARGET/release/$BINARY" --version)" = "voci $RELEASE_VERSION"
          "target/$TARGET/release/$BINARY" --help
          "target/$TARGET/release/$BINARY" shell --help
      - name: Package executable and documentation
        shell: bash
        run: mise run package --target "$TARGET" --no-build --output-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v${{ needs.version.outputs.semver }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        shell: bash
        run: |
          archives=( *.tar.gz *.zip )
          test "${#archives[@]}" -eq 4
          sha256sum "${archives[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Upload assets and publish
        shell: bash
        run: |
          # A failed upload leaves a draft that a rerun can finish safely.
          # Published releases are never overwritten by a rerun.
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to overwrite it." >&2
              exit 1
            fi
          else
            flags=()
            if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --generate-notes \
              --title "$RELEASE_TAG" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
