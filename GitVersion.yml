workflow: GitHubFlow/v1
mode: ContinuousDelivery
branches:
  main:
    # Every push to main is released, so omit the prerelease commit counter.
    mode: ContinuousDeployment
    label: ''
tag-prefix: '[vV]?'
update-build-number: false
major-version-bump-message: '(?m)^\w+(\([^\r\n]+\))?!:|^BREAKING[ -]CHANGE:'
minor-version-bump-message: '(?m)^feat(\([^\r\n]+\))?:'
patch-version-bump-message: '(?m)^(fix|perf)(\([^\r\n]+\))?:'
