# Voci keybinding profile. Unspecified actions retain shared defaults.
# Arrays contain alternative bindings for the same action.
# "gg" is a two-key sequence; "G" is an uppercase character.
# Navigation letters do not act as shortcuts while editing text.
# Other actions retain the shared defaults described in the pitch.

[navigation]
left = ["Left", "t"]
right = ["Right", "r"]
up = ["Up", "m"]
down = ["Down", "n"]
# In inputs, b means word-begin; Home/gg still reach the beginning of the field.
home = ["Home", "gg", "b"]
end = ["End", "G", "l"]

# Input actions apply in normal/visual modes; letters are text in insert mode.
[actions]
undo = ["u"] # Normal input only.
redo = ["Ctrl-r"] # Normal input; Ctrl-r still refreshes the history list.
append = ["a"] # Normal input: enter insert mode after the current character.
pane_prefix = ["Ctrl-w"] # Toggle persistent pane selection; Esc also exits.
paste = ["p"] # Normal: paste after the current character; visual: replace selection.
paste_before = ["P"] # Normal: paste before the cursor; visual: replace selection.
visual = ["v"]
change_selection = ["c"] # Visual: cut selection and enter insert mode.
yank_selection = ["y"]
delete_selection = ["d", "x"] # d is visual only; x also cuts a normal-mode character.
delete_line = ["dd"] # Normal input: copy the whole line to the clipboard and delete it.
word_begin = ["Ctrl-Left", "b"]
word_end = ["Ctrl-Right", "e"]
